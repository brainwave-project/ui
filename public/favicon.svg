<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-label="Brainwave">
  <defs>
    <linearGradient id="brain-fill" x1="16" y1="5" x2="16" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd4dc"/>
      <stop offset="45%" stop-color="#e9869d"/>
      <stop offset="100%" stop-color="#b84a68"/>
    </linearGradient>
  </defs>

  <!-- Two rotated lobes (union → brain silhouette); no backdrop square -->
  <g fill="url(#brain-fill)">
    <ellipse cx="11.6" cy="15.9" rx="7.05" ry="11.05" transform="rotate(-13 11.6 15.9)"/>
    <ellipse cx="20.4" cy="15.9" rx="7.05" ry="11.05" transform="rotate(13 20.4 15.9)"/>
    <ellipse cx="16" cy="25.1" rx="4.85" ry="3.05"/>
  </g>

  <!-- Light sulcal lines -->
  <g fill="none" stroke="#9a3550" stroke-opacity="0.45" stroke-width="0.85" stroke-linecap="round">
    <path d="M16 10.2v11.2"/>
    <path d="M10.8 14.8c1.8-1 3.9-1.1 5.2-.2"/>
    <path d="M21.2 14.8c-1.8-1-3.9-1.1-5.2-.2"/>
    <path d="M11.4 19.6c2.1-.4 4.3.2 4.6 1.4"/>
    <path d="M20.6 19.6c-2.1-.4-4.3.2-4.6 1.4"/>
  </g>
</svg>
